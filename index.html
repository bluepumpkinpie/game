<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Легенда Ночного Замка ✨ - Point & Click Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="game-header">
            <h1>✨ Легенда Ночного Замка ✨</h1>
            <div id="info-panel">
                <span id="current-room"></span>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="game-ui">
            <div id="description-panel">
                <p id="description-text">Добро пожаловать в древний замок! Исследуйте комнаты, знакомьтесь с персонажами и раскройте тайну сокровища.</p>
            </div>

            <div id="inventory-panel">
                <h3>Инвентарь</h3>
                <div id="inventory-items"></div>
            </div>

            <div id="actions-panel">
                <button id="btn-examine">Осмотреть</button>
                <button id="btn-use">Использовать</button>
                <button id="btn-take">Взять</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
